name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos-backend:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and test macOS platform crate
        run: |
          cargo clippy -p agentplay-platform --all-targets -- -D warnings
          cargo test -p agentplay-platform
          cargo build -p agentplay-platform --example macos_probe
      - name: Smoke-test real window capture and keyboard input
        shell: bash
        run: |
          set -euo pipefail

          printf 'agentplay smoke test\n' > "$RUNNER_TEMP/agentplay-smoke.txt"
          open -a TextEdit "$RUNNER_TEMP/agentplay-smoke.txt"

          PROBE=target/debug/examples/macos_probe
          MATCH=""
          PID=""
          for _ in {1..20}; do
            PID="$(pgrep -x TextEdit | head -n 1 || true)"
            if [[ -n "$PID" ]]; then
              WINDOWS="$($PROBE list || true)"
              MATCH="$(printf '%s\n' "$WINDOWS" | grep "pid=$PID bundle=com.apple.TextEdit" | head -n 1 || true)"
              [[ -n "$MATCH" ]] && break
            fi
            sleep 1
          done

          [[ -n "$MATCH" ]] || { echo 'TextEdit window not discovered' >&2; exit 1; }
          WINDOW_ID="$(printf '%s\n' "$MATCH" | sed -E 's/^window=([0-9]+).*/\1/')"

          $PROBE capture "$WINDOW_ID" "$PID" com.apple.TextEdit
          mv frame.rgba before.rgba

          for _ in {1..12}; do
            $PROBE press "$WINDOW_ID" "$PID" com.apple.TextEdit a
          done
          sleep 0.5

          $PROBE capture "$WINDOW_ID" "$PID" com.apple.TextEdit
          mv frame.rgba after.rgba

          test -s before.rgba
          test -s after.rgba
          python3 - <<'PY'
          before = open('before.rgba', 'rb').read()
          after = open('after.rgba', 'rb').read()
          if len(before) != len(after):
              print(f'frame byte length changed: {len(before)} -> {len(after)}')
              raise SystemExit(0)
          changed = sum(a != b for a, b in zip(before, after))
          print(f'changed RGBA bytes after keyboard input: {changed}')
          if changed < 1000:
              raise SystemExit('keyboard input did not produce a sufficiently large visual change')
          PY
